<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Border gradients -->
    <linearGradient id="borderLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E5EC"/>
      <stop offset="50%" stop-color="#8A95A5"/>
      <stop offset="100%" stop-color="#4A5565"/>
    </linearGradient>
    <linearGradient id="borderRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <!-- Inner gradients -->
    <linearGradient id="innerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="innerRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="15%" stop-color="#93C5FD" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left Outer Border -->
  <path d="M 512 80 L 128 220 C 128 550 274 800 512 944 Z" fill="url(#borderLeft)"/>
  <!-- Right Outer Border -->
  <path d="M 512 80 L 896 220 C 896 550 750 800 512 944 Z" fill="url(#borderRight)"/>
  
  <!-- Left Inner Shield -->
  <path d="M 512 116 L 158 245 C 158 540 292 766 512 900 Z" fill="url(#innerLeft)"/>
  <!-- Right Inner Shield -->
  <path d="M 512 116 L 866 245 C 866 540 732 766 512 900 Z" fill="url(#innerRight)"/>
  
  <!-- Outer Stroke -->
  <path d="M 512 116 L 158 245 C 158 540 292 766 512 900 L 866 245 C 866 540 732 766 512 900 Z" fill="none" stroke="#000" stroke-width="10" opacity="0.3"/>
  <path d="M 512 80 L 128 220 C 128 550 274 800 512 944 L 896 220 C 896 550 750 800 512 944 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

  <!-- Left Inner Shield line -->
  <path d="M 512 116 L 512 900" stroke="#000000" stroke-width="2" opacity="0.8"/>
  
  <!-- Center Swirl -->
  <g transform="translate(512, 512)">
    <!-- Silver Swirl -->
    <path d="M 30 -220 C -150 -200 -220 -80 -180 50 C -100 20 -40 -30 -30 -100 C -10 -200 120 -150 180 -100 C 120 -200 -30 -240 30 -220 Z" fill="#D1D5DB"/>
    <!-- Blue Swirl -->
    <path d="M -30 220 C 150 200 220 80 180 -50 C 100 -20 40 30 30 100 C 10 200 -120 150 -180 100 C -120 200 30 240 -30 220 Z" fill="#3B82F6"/>
    
    <!-- Star -->
    <circle cx="0" cy="0" r="100" fill="url(#starGlow)"/>
    <path d="M 0 -80 L 12 -20 L 72 -12 L 12 -4 L 0 56 L -12 -4 L -72 -12 L -12 -20 Z" fill="#FFFFFF"/>
  </g>
</svg>
